name: Expand preserved question baseline

on:
  push:
    paths:
      - 'bootstrap/READY'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode preserved baseline
        run: |
          (
            cat bootstrap/chunks/part-00.b64
            cat bootstrap/chunks/part-01.b64
            cat bootstrap/chunks/part-02.b64
            cat bootstrap/chunks/part-03.b64
            cat bootstrap/chunks/part-04.b64
            cat bootstrap/fixchunks/part-05-00.b64
            cat bootstrap/fixchunks/part-05-01.b64
            cat bootstrap/fixchunks/part-05-02.b64
            cat bootstrap/fixchunks/part-06-00.b64
            cat bootstrap/fixchunks/part-06-01.b64
            cat bootstrap/fixchunks/part-06-02.b64
            cat bootstrap/fixchunks/part-07-00.b64
            cat bootstrap/fixchunks/part-07-01.b64
            cat bootstrap/fixchunks/part-07-02.b64
            cat bootstrap/chunks/part-08.b64
          ) | base64 --decode > /tmp/preserved-original-1150.tar.gz
          echo "224e1cbab65a8c928d1992d8838f06f8f979180b81d3e9bae6112471ecd2fe9e  /tmp/preserved-original-1150.tar.gz" | sha256sum -c -
          tar -xzf /tmp/preserved-original-1150.tar.gz
      - name: Verify baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path("preserved-original/books")
          files = sorted(root.glob("book-*/chapter-*/original-questions.md"))
          ids = []
          for f in files:
              ids += re.findall(r'^## (Q\d{4})\b', f.read_text(), re.M)
          assert len(files) == 29, len(files)
          assert len(ids) == 1150, len(ids)
          assert len(set(ids)) == 1150, len(set(ids))
          assert ids[0] == "Q0001"
          assert ids[-1] == "Q1150"
          print("Verified 29 chapters and 1,150 unique questions.")
          PY
      - name: Commit expanded baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preserved-original
          if git diff --cached --quiet; then
            echo "Preserved baseline already expanded."
          else
            git commit -m "Expand immutable 1,150-question baseline"
            git push
          fi
